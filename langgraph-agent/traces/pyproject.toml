[project]
name = "langslice-traces"
version = "0.1.0"
description = "Replay captured LangSlice conversations into a LangSmith project - a LangSmith Essentials demo app"
requires-python = ">=3.11"
# This folder is its own tiny project on purpose. The agent lives in
# langgraph-agent/ and claude-sdk-agent/, and neither of them contains traces/,
# so without a pyproject here `uv run python upload_traces.py` would find no
# project and start from an empty environment. Nothing here imports an agent -
# these two scripts only talk to the LangSmith API.
dependencies = [
    # 0.10.15 is where client.runs.query() lands, which both scripts use to read
    # runs back. The sync client.list_runs() it replaced stops working 31 Jan 2027.
    "langsmith>=0.10.15",
    "python-dotenv>=1.0.1",
]

[tool.uv]
# Scripts, not a library: nothing to build or install.
package = false
